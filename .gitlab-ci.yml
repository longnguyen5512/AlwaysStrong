stages:
  - build

nightly:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - module/**/*
        - module-variants/**/*
        - attest/**/*
        - native/**/*
        - banner.png
        - build.sh
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends zip unzip curl git ca-certificates
    - find native -path '*/prebuilt/*' -type f -exec touch {} +
    - |
      base=$(sed -n 's/^version=//p' module/module.prop)
      tag="$(git rev-list --count HEAD)-$(git rev-parse --short=7 HEAD)-nightly"
      echo "AS_BUILD_TAG=$tag" >> build.env
      echo "AS_ZIPVER=${base}-${tag}" >> build.env
  script:
    - source build.env
    - bash build.sh --build-tag "$AS_BUILD_TAG"
    - bash build.sh --engine trickystoreoss --build-tag "$AS_BUILD_TAG"
    - bash build.sh --engine teesim --build-tag "$AS_BUILD_TAG"
    - ls -la out/
    # Stable, version-less copy of every variant so each has a permanent
    # per-variant download link (GitLab serves a single artifact file by path):
    #   https://gitlab.com/Evokerr/AlwaysStrong/-/jobs/artifacts/main/raw/out/latest/AlwaysStrong-nopif-TEESIM.zip?job=nightly
    # mirrors what nightly.link gives on the GitHub side. The versioned zips in
    # out/ stay for the download-all artifact archive; module.prop inside still
    # carries the real version + nightly tag, so the copy is only renamed.
    - |
      set -eu
      mkdir -p out/latest
      for z in out/AlwaysStrong-*.zip; do
        base=$(basename "$z" .zip)                 # AlwaysStrong-<ver>-nopif-TEESIM
        rest=${base#"AlwaysStrong-${AS_ZIPVER}"}   # -nopif-TEESIM  (empty for default)
        [ "$rest" = "$base" ] && { echo "unexpected zip name: $base" >&2; exit 1; }
        cp "$z" "out/latest/AlwaysStrong${rest}.zip"
      done
      ls -la out/latest/
  artifacts:
    paths:
      - out/AlwaysStrong-*.zip
      - out/latest/*.zip
    expire_in: 90 days
